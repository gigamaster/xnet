name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Grant permissions required for the official GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # We REMOVE 'cache: npm' because that requires a lockfile to exist locally

      - name: Clean Install (Bypasses Windows Lockfile Issues)
        run: |
          # Delete any lockfile pushed from Windows to avoid EBADPLATFORM errors
          rm -f package-lock.json
          # Force a fresh install based strictly on package.json
          npm install

      - name: Build site
        # This will now find the correct @rollup/rollup-linux-x64-gnu module
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4