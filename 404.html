  document.addEventListener('DOMContentLoaded', function() {
    // Find all heading elements but exclude h1 used for page title
    const headings = document.querySelectorAll('h2, h3, h4'); // Customized headings
    const tocList = document.getElementById('toc-list');
    const tocSidebar = document.getElementById('toc-sidebar');
    
    // Only show TOC if there are headings
    if (headings.length === 0) {
      tocSidebar.style.display = 'none';
      return;
    }
    
    // Generate TOC items
    headings.forEach((heading, index) => {
      // Generate ID if doesn't exist
      if (!heading.id) {
        const headingText = heading.textContent.trim();
        heading.id = headingText.toLowerCase()
          .replace(/[^\w\s-]/g, '')
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-+|-+$/g, '') || `heading-${index}`;
      }
      
      // Create TOC item
      const listItem = document.createElement('li');
      const link = document.createElement('a');
      
      // Set appropriate indentation based on heading level
      const level = parseInt(heading.tagName.charAt(1));
      
      // Query (h2,h3,h4) and starts h2 at ml-2):
      // listItem.className = `ml-${Math.max(0, (level - 1) * 2)}`;

      // Customizez to start h2 at ml-0):
      listItem.className = `ml-${Math.max(0, (level - 2) * 2)}`;
      
      link.href = `#${heading.id}`;
      link.textContent = heading.textContent;
      link.className = 'block truncate py-1 px-2 text-xs text-zinc-600 dark:text-zinc-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors duration-200 rounded hover:bg-zinc-100 dark:hover:bg-zinc-800';
      link.dataset.level = level;
      
      // Add smooth scrolling
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.getElementById(this.getAttribute('href').substring(1));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
          // Update URL hash
          history.pushState(null, null, this.getAttribute('href'));
        }
      });
      
      listItem.appendChild(link);
      tocList.appendChild(listItem);
    });
    
    // Show the TOC sidebar
    tocSidebar.style.display = 'block';
  });
</script> <script>
	// Check user preference or saved setting
	const savedTheme = localStorage.getItem('theme');
	const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
	const theme = savedTheme || (prefersDark ? 'dark' : 'light');

	// Apply class on page load
	document.documentElement.classList.toggle('dark', theme === 'dark');

	// Theme toggle function
	function toggleTheme() {
	const isNowDark = document.documentElement.classList.toggle('dark');
	localStorage.setItem('theme', isNowDark ? 'dark' : 'light');
	return isNowDark;
	}

	// Make it globally available
	window.toggleTheme = toggleTheme;

	// Event listener for the toggle button
	window.onload = function () {
	
	// Add theme toggle event listener
	const themeButtons = document.querySelectorAll('[data-aw-toggle-color-scheme]');
	themeButtons.forEach(button => {
		button.addEventListener('click', toggleTheme);
	});
	};

</script>  </body> </html>
